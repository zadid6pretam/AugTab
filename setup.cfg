[options]
zip_safe = False
include_package_data = True

[options.packages.find]
where = .
include =
    augtab
    augtab.*
exclude =
    tests
    tests.*
    docs
    docs.*

[flake8]
max-line-length = 100
exclude =
    .git,
    __pycache__,
    build,
    dist,
    *.egg-info,
    .venv,
    venv

[tool:pytest]
testpaths = tests
